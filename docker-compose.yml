version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app-network
    environment:
    - TZ=Europe/Moscow
    restart: unless-stopped

  db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d # Монтируем SQL-скрипты
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: unless-stopped

  cache:
    image: redis:alpine
    container_name: my_redis
    ports:
      - "6379:6379" # Порт Redis
    volumes:
      - redis_data:/data # Для персистентности
    networks:
      - app-network
    restart: unless-stopped

volumes:
  db-data:
  redis_data:

networks:
  app-network:
    driver: bridge
